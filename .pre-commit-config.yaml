# See https://pre-commit.com. Install everything with one `pre-commit install`
# — plain `install` would only wire the pre-commit stage and leave the
# commit-msg and pre-push hooks below dormant.
default_install_hook_types: [pre-commit, pre-push, commit-msg]

repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      # Re-checked by commit-lint.yml, so a contributor who never installed the
      # hooks is still caught. `.cliff.toml` groups the CHANGELOG by these
      # prefixes, so a commit that does not parse lands in "Others" or vanishes.
      - id: conventional-pre-commit
        stages:
          - commit-msg

  - repo: local
    hooks:
      # Each gate sits at the cheapest stage that still catches it in time.
      # `task check` is deliberately not wired in: at ~2 minutes it would only
      # teach the habit of `--no-verify`.
      #
      #   commit-msg  conventional commits   instant
      #   pre-commit  formatting             seconds
      #   pre-push    clippy + licensing     a minute or two
      #   CI          the full suite         however long it takes

      - id: cargo-fmt
        name: cargo fmt --check
        entry: env -u RUSTUP_TOOLCHAIN cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false
        stages:
          - pre-commit

      - id: cargo-clippy
        name: cargo clippy (all targets)
        entry: env -u RUSTUP_TOOLCHAIN task lint
        language: system
        types: [rust]
        pass_filenames: false
        stages:
          - pre-push

      # Deliberately NOT filtered by file type: the licensing sweep enumerates
      # every git-tracked file, so `types: [rust]` would skip exactly the
      # prose-only commits most likely to trip it.
      - id: licensing
        name: licensing guard
        entry: env -u RUSTUP_TOOLCHAIN cargo test --test licensing
        language: system
        pass_filenames: false
        stages:
          - pre-push

      # Secrets in the staged diff, before they reach history: a pushed secret
      # has to be rotated, not just removed. False positives go in .gitleaks.toml.
      - id: gitleaks
        name: gitleaks (staged)
        entry: gitleaks git --pre-commit --staged --redact --verbose
        language: system
        pass_filenames: false
        always_run: true
        stages:
          - pre-commit

  # Stock file guards: oversized files, leftover conflict markers, YAML that
  # does not parse. Not the whitespace fixers: they rewrite patches, fixtures
  # and generated files (piloted on linux-config, 2026-11-18).
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        stages: [pre-commit]
