# git-cliff generates only the grouped commit list under each release heading;
# the prose above it is hand-written. `TAG=v1.1.0 task changelog` prepends a new
# section, which then becomes the GitHub release body verbatim via
# .github/scripts/extract-changelog.sh.
#
# BREAKING CHANGES ARE RENDERED TWICE, ON PURPOSE: a `feat(cli)!:` is both a
# feature and a break, and the ⚠ block prints `breaking_description` (what stops
# working) while the type group prints the subject (what changed).
#
# The filter chain on that bullet is load-bearing. With a `BREAKING CHANGE:`
# footer, `breaking_description` holds everything to the end of the message, so
# `split(pat="\\n\\n") | first` takes the first paragraph and the second
# split/join flattens its wrapping. `replace(from="\\n", to=" ")` silently does
# nothing instead — Tera unescapes `\\n` in `split`'s argument but not in
# `replace`'s. With a bare `!` and no footer it falls back to the subject.
#
# The block sits outside the `group_by` loop, so it needs no sort key. It draws
# on the same filtered list as the groups: a breaking commit whose type is
# skipped below is skipped here too.

[changelog]
# MUST stay byte-identical to the top of CHANGELOG.md. `--prepend` strips this
# string from the existing file and re-emits it above the new section; if it
# does not match, the strip silently no-ops, the new section lands above the
# file title, and extract-changelog.sh swallows the preamble into the release
# body. Edit one, edit the other.
header = """
# Changelog

What changed in each `br` release and why. Highlights are written by hand; the
commit lists under them are generated with [git-cliff](https://git-cliff.org)
via `TAG=vX.Y.Z task changelog`.

Versions follow [semver](https://semver.org). Commits follow
[Conventional Commits](https://www.conventionalcommits.org).

---

"""
body = """
{% if version %}\
## {{ version }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}
{% set breaking = commits | filter(attribute="breaking", value=true) %}\
{% if breaking | length > 0 %}
### ⚠ Breaking Changes
{% for commit in breaking %}
- [{{ commit.id | truncate(length=7, end="") }}](https://github.com/Toshik1978/beads/commit/{{ commit.id }}) {{ commit.breaking_description | split(pat="\\n\\n") | first | split(pat="\\n") | join(sep=" ") | trim }}
{%- endfor %}
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- [{{ commit.id | truncate(length=7, end="") }}](https://github.com/Toshik1978/beads/commit/{{ commit.id }}) {{ commit.raw_message | split(pat="\\n") | first | trim }}
{%- endfor %}
{% endfor %}
---


"""
footer = ""
trim = true

[git]
conventional_commits = true
# Keep non-conventional commits — they land in "Others" rather than vanishing.
filter_unconventional = false
filter_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
topo_order = false

# Order matters: the first matching parser wins. Skips come first so that, for
# example, `chore(beads):` never reaches the catch-all Others rule.
commit_parsers = [
  { message = '^Merge ', skip = true },
  # `chore(beads):` closes issues in this project's own tracker — bookkeeping
  # that would otherwise be the bulk of the changelog. No `^plan` rule: the
  # commit-msg hook rejects that prefix, so it could never match, and a skip
  # rule for commits that cannot exist reads as coverage.
  { message = '^chore', skip = true },
  { message = '^test', skip = true },
  { message = '^style', skip = true },
  # Dependabot noise: without these two the changelog is mostly version bumps.
  # Single-quoted TOML literal strings, so the backslash is NOT an escape and
  # reaches the regex engine as-is. Do not double it.
  { message = '^build\(deps', skip = true },
  { message = '^ci\(deps', skip = true },
  { message = '^feat', group = "<!-- 0 -->Features" },
  { message = '^fix', group = "<!-- 1 -->Bug Fixes" },
  { message = '^perf', group = "<!-- 2 -->Performance" },
  { message = '^docs', group = "<!-- 3 -->Documentation" },
  { message = '.*', group = "<!-- 4 -->Others" },
]
