version: "3"

# `pipefail` is global and deliberate. Verification commands here pipe cargo
# output into grep/awk, and without it the pipeline reports the last command's
# status rather than cargo's — which once produced a false "builds clean on
# stable" reading for a build that had exited 101.
set: [pipefail]

vars:
  TEST_LOG: /tmp/beads-test.log
  TEST_FAILURES: /tmp/beads-failing.txt

tasks:
  setup:ci:
    desc: Prepare the workspace on CI

  # Nothing in this repository pins a toolchain (see CLAUDE.md), so a stale
  # `RUSTUP_TOOLCHAIN` in a contributor's shell silently runs the whole gate on
  # nightly and reports success — which has happened here.
  #
  # This DETECTS rather than neutralises: unsetting the variable would also
  # defeat a deliberate override such as `RUSTUP_TOOLCHAIN=1.95.0 task build`,
  # the way `rust-version` is checked. So it refuses pre-release channels only.
  toolchain:check:
    desc: Fail unless the active rustc is a stable release
    # `silent` suppresses Task's echo of the script; the guard's own stdout and
    # stderr still print.
    silent: true
    cmd: |
      release=$(rustc -vV | sed -n 's/^release: //p')
      echo "rustc release: ${release:-<unknown>}"
      case "${release}" in
        "")
          echo "toolchain:check: could not read 'release:' from 'rustc -vV'" >&2
          exit 1
          ;;
        *-nightly | *-beta* | *-dev)
          echo "toolchain:check: refusing to run the gate on '${release}'." >&2
          echo "  beads builds on stable Rust and has no rust-toolchain.toml." >&2
          echo "  A pre-release compiler here usually means RUSTUP_TOOLCHAIN is" >&2
          echo "  set in your shell. Check with 'echo \$RUSTUP_TOOLCHAIN' and" >&2
          echo "  unset it, or re-run under 'env -u RUSTUP_TOOLCHAIN'." >&2
          exit 1
          ;;
      esac

  format:
    desc: Format all Rust sources
    cmd: cargo fmt --all

  format:check:
    desc: Fail if any source is unformatted
    cmd: cargo fmt --all -- --check

  lint:
    desc: Run clippy over every target
    cmd: cargo clippy --workspace --all-targets

  audit:
    desc: Check dependencies for advisories and yanked crates
    cmd: cargo audit --deny yanked

  build:
    desc: Build the br binary and every test target
    cmd: cargo build --workspace --all-targets

  build:release:
    desc: Build the optimized br binary
    cmd: cargo build --release
    generates:
      - target/release/br

  # Two commands because nextest cannot run doctests — rustdoc owns that path.
  # Drop the second and the doctests silently stop running. `--workspace` so
  # test-support's own tests run, once, instead of once per integration binary.
  test:
    desc: Run the full test suite
    cmds:
      - cargo nextest run --workspace --no-fail-fast
      - cargo test --workspace --doc

  test:lib:
    desc: Run unit tests only (fast — skips the integration binaries)
    cmd: cargo nextest run --lib

  test:one:
    desc: 'Run a subset — e.g. `task test:one -- -E ''test(defer_until_invalid_error)'''
    cmd: cargo nextest run {{.CLI_ARGS}}

  # TZ and LANG are assigned on the `cmd:` line, not in an `env:` block, and
  # that is a fix rather than a style choice: Task appends its override *after*
  # the inherited os.Environ() entry, so a child's getenv() resolves the
  # inherited (wrong) value for any name the shell already exports — LANG among
  # them. Verified against task 3.52.0. Do not move these into `env:`.
  test:hermetic:
    desc: Run the suite under a pinned timezone and locale
    cmds:
      - TZ=UTC LANG=C cargo nextest run --workspace --no-fail-fast
      - TZ=UTC LANG=C cargo test --workspace --doc

  # On macOS `/tmp` is a symlink and `TMPDIR` is reached through `/private`;
  # 125 failures once traced to path-identity mismatches that could not exist on
  # Linux. Running the suite where the symlink is absent is what separates a fix
  # that canonicalises correctly from one that hard-codes a macOS assumption.
  #
  # HONEST LIMIT: the host is aarch64, so this covers OS divergence only. Do not
  # describe it as full Linux parity.
  #
  # Shape notes:
  # - Cache volumes are named per platform. CARGO_TARGET_DIR has no triple in
  #   its path, so an amd64 and an arm64 run sharing one volume overwrite each
  #   other and every alternation pays a full rebuild.
  # - The container script arrives via a QUOTED HEREDOC. It used to be
  #   `bash -eu -c '...'`, where every apostrophe in the script silently ended
  #   the quoting; the task died with `reached EOF without closing quote` and
  #   stayed broken unnoticed. Do not "simplify" it back to -c.
  # - `git` and `sqlite3` are installed because the suite shells out to both.
  #   Nothing else is: no test shells out to any other binary (bds-2vi).
  # - `safe.directory` is required: the bind-mounted worktree is not owned by
  #   the container's root, and tests/licensing.rs is driven by `git ls-files`.
  # - CARGO_BUILD_JOBS is capped because OrbStack's VM gets ~15.7GB regardless
  #   of the host, and uncapped linking of ~120 debug binaries gets `ld`
  #   OOM-killed. Concurrency only; artifacts are identical.
  # - Override PLATFORM on an x86_64 host, or it silently drops into emulation.
  test:linux:
    desc: Run the full suite in a Linux container, proving it is not macOS-specific
    vars:
      PLATFORM: '{{.PLATFORM | default "linux/arm64"}}'
      IMAGE: '{{.IMAGE | default "rust:1-slim"}}'
      JOBS: '{{.JOBS | default "4"}}'
    cmd: |
      slug=$(printf '%s' '{{.PLATFORM}}' | tr '/' '-')
      docker run --rm -i \
        --platform {{.PLATFORM}} \
        -v "$PWD":/work -w /work \
        -v "br-target-$slug:/linux-target" \
        -v "br-registry-$slug:/usr/local/cargo/registry" \
        -e CARGO_TARGET_DIR=/linux-target \
        -e CARGO_BUILD_JOBS={{.JOBS}} \
        {{.IMAGE}} \
        bash -eus <<'CONTAINER_SCRIPT'
        apt-get -qq update
        DEBIAN_FRONTEND=noninteractive apt-get -qq install -y --no-install-recommends git sqlite3 >/dev/null
        git config --global --add safe.directory /work
        rustc --version
        # `bundled` rusqlite compiles C SQLite, so a missing cc must fail here
        # rather than 200 lines into a link error. Checked separately from the
        # pretty-print: this is the container's `bash -eu`, with no pipefail, so
        # `cc --version | head -1` would report head's status.
        command -v cc >/dev/null || {
          echo "no C compiler in this image; rusqlite's bundled SQLite cannot build" >&2
          exit 1
        }
        cc --version | head -1
        # Evidences the architecture a PLATFORM override actually ran on.
        uname -m
        # Deliberately `cargo test`, not nextest: this task varies the OS, and
        # installing another tool into a throwaway container buys nothing toward
        # that. It is also the one path where CLAUDE.md's abort gate still
        # applies, since a binary dying mid-run takes its `test result:` line.
        cargo test --workspace --no-fail-fast
      CONTAINER_SCRIPT

  # `test:linux` holds the architecture fixed; this moves that axis, producing a
  # genuinely x86_64 container (`rust:1-slim` is a manifest list).
  #
  # IT DOES NOT COMPLETE ON THIS HOST, and that is a property of the emulator:
  # with Rosetta disabled OrbStack falls back to QEMU, which segfaults inside
  # itself while lld links the first debuginfo-heavy test binary. The deps build
  # fine; zero test binaries run. Re-running fails identically. Kept because it
  # is correct wherever a viable x86_64 path exists — and native x86_64 coverage
  # arrives via ci.yml's ubuntu-latest leg, unemulated.
  test:linux:amd64:
    desc: Run the full suite on x86_64 Linux, covering the architecture axis test:linux does not
    cmds:
      - task: test:linux
        vars:
          PLATFORM: linux/amd64

  # rusqlite's `bundled` feature compiles C SQLite, so every release target
  # needs a C compiler *for that target*; `rustup target add` supplies a Rust
  # std, not a cross libc. This task is the standing proof that holds.
  #
  # THE TARGET LIST IS THE RELEASE MATRIX IN .goreleaser.yaml AND MUST STAY
  # EQUAL TO IT — this is only a proof of the release targets if it builds
  # exactly those. Each was also executed (aarch64-musl on Alpine, which has no
  # glibc) through a real `br init` + `create` + `list` round-trip, since
  # linking is not running.
  #
  # THE `rustup update stable` IS LOAD-BEARING. DO NOT DELETE IT. The image
  # ships rustc 1.93.0, below this crate's 1.95 floor, and every target then
  # fails with a message blaming the dependencies for a toolchain problem.
  #
  # NOT A GATE: `task check` does not call this. Run it when the release
  # pipeline or the storage engine changes.
  build:cross:
    desc: Prove every release target builds and links with the bundled C SQLite
    vars:
      PLATFORM: '{{.PLATFORM | default "linux/arm64"}}'
      IMAGE: '{{.IMAGE | default "ghcr.io/rust-cross/cargo-zigbuild:latest"}}'
      JOBS: '{{.JOBS | default "4"}}'
    cmd: |
      docker run --rm \
        --platform {{.PLATFORM}} \
        -v "$PWD":/work -w /work \
        -v br-zig-target:/zig-target \
        -v br-zig-registry:/usr/local/cargo/registry \
        -e CARGO_TARGET_DIR=/zig-target \
        -e CARGO_BUILD_JOBS={{.JOBS}} \
        {{.IMAGE}} \
        bash -eu -c '
          git config --global --add safe.directory /work
          rustup update stable >/dev/null && rustup default stable >/dev/null
          rustc --version
          zig version
          failed=0
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl \
                   x86_64-apple-darwin aarch64-apple-darwin; do
            # `|| true` is required: under `bash -eu` an unavailable triple would
            # abort the loop with no output naming the target that died. Let the
            # build below produce the diagnosis instead.
            rustup target add "$t" >/dev/null 2>&1 || true
            if cargo zigbuild --release --target "$t" >"/tmp/$t.log" 2>&1; then
              echo "PASS  $t"
            else
              echo "FAIL  $t"
              tail -20 "/tmp/$t.log" | sed "s/^/        /"
              failed=1
            fi
          done
          exit $failed
        '

  # RELEASE TASKS
  #
  # A release is cut by pushing a tag; .github/workflows/release.yml does the
  # rest. Everything below exists so each thing the workflow checks can be
  # checked *before* the tag exists, while it is still free to be wrong.
  # docs/RELEASING.md is the sequence these fit into. `goreleaser` and
  # `git-cliff` are pinned in .mise.toml; Rust deliberately is not.

  changelog:
    desc: 'Prepend the next release''s commit list to CHANGELOG.md (TAG=v1.1.0 overrides the computed bump)'
    cmd: git-cliff --unreleased {{if .TAG}}--tag {{.TAG}}{{else}}--bump{{end}} --prepend CHANGELOG.md

  release:check:
    desc: Validate .goreleaser.yaml without building anything
    cmd: goreleaser check

  # The exact two guards the workflow runs first, against a tag that does not
  # exist yet — both are cheap here and expensive after a push, since correcting
  # a public tag means deleting it.
  release:verify:
    desc: 'Check a prospective tag against Cargo.toml and CHANGELOG.md (TAG=v1.1.0)'
    requires:
      vars: [TAG]
    cmds:
      - .github/scripts/check-release-version.sh '{{.TAG}}'
      - .github/scripts/extract-changelog.sh '{{.TAG}}'

  # The whole release minus the publishing: proves every target builds, links
  # and archives from *this* commit, which a tag push would otherwise discover
  # halfway through.
  #
  # It runs in a container because the *-apple-darwin targets link
  # CoreFoundation and zig bundles no macOS SDK — on a bare macOS host,
  # aarch64-apple-darwin fails with `undefined symbol: _CFRelease`, and pointing
  # SDKROOT at the Command Line Tools SDK does not fix it. This image carries
  # its own SDK and is the one the release workflow uses.
  #
  # `target/` is a named volume so alternating with a host `cargo build` does
  # not invalidate both caches. goreleaser is fetched inside the container
  # because the image does not ship it and a macOS binary cannot run there; pin
  # it with GORELEASER=x.y.z to match a specific CI run.
  release:snapshot:
    desc: Build every release archive locally, in the image the release job uses
    vars:
      PLATFORM: '{{.PLATFORM | default "linux/arm64"}}'
      IMAGE: '{{.IMAGE | default "ghcr.io/rust-cross/cargo-zigbuild:0.23.0"}}'
      GORELEASER: '{{.GORELEASER | default "2.17.1"}}'
      JOBS: '{{.JOBS | default "4"}}'
    cmd: |
      docker run --rm \
        --platform {{.PLATFORM}} \
        -v "$PWD":/work -w /work \
        -v br-release-target:/work/target \
        -v br-zig-registry:/usr/local/cargo/registry \
        -e CARGO_BUILD_JOBS={{.JOBS}} \
        {{.IMAGE}} \
        bash -eu -c '
          git config --global --add safe.directory /work
          # LOAD-BEARING: the image ships a rustc below this crate 1.95 floor,
          # and without this every target fails with a message that blames the
          # dependencies rather than the compiler.
          rustup update stable >/dev/null && rustup default stable >/dev/null
          rustc --version
          case "$(uname -m)" in
            aarch64) grarch=arm64 ;;
            x86_64)  grarch=x86_64 ;;
            *) echo "no goreleaser build for $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL "https://github.com/goreleaser/goreleaser/releases/download/v{{.GORELEASER}}/goreleaser_Linux_${grarch}.tar.gz" \
            | tar xz -C /usr/local/bin goreleaser
          goreleaser --version | tail -3
          goreleaser release --snapshot --clean --skip=publish
        '

  # A diagnostic, never a gate — nothing derives a verdict from it. `|| true` is
  # intentional: this task exists to report on a failing run, and aborting on a
  # non-zero cargo exit would skip the counts and names you wanted. Use
  # `task test` when you want the exit code itself.
  test:report:
    desc: Run the suite and report "passed=N failed=N" plus the failing test names
    cmds:
      - |
        cargo nextest run --workspace --no-fail-fast > "{{.TEST_LOG}}" 2>&1 || true
        awk '/tests run:/ {for(i=1;i<=NF;i++){if($i ~ /^passed/)p=$(i-1); if($i ~ /^failed/)f=$(i-1)}} END{print "passed="p+0" failed="f+0}' "{{.TEST_LOG}}"
        # nextest prints one authoritative Summary line and names each failure
        # on its own line. FAIL covers assertions; the rest are the abrupt
        # deaths that used to vanish with a binary's missing `test result:`.
        grep -E '^ +(FAIL|SIGSEGV|SIGABRT|ABORT|TIMEOUT|LEAK)' "{{.TEST_LOG}}" \
          | sed -E 's/^ +([A-Z]+) +\[[^]]*\] +/\1 /' | sort -u > "{{.TEST_FAILURES}}"
        echo "failing test names -> {{.TEST_FAILURES}} ($(wc -l < "{{.TEST_FAILURES}}" | tr -d ' ') entries)"

  check:
    desc: Everything CI runs
    cmds:
      - task: toolchain:check
      - task: format:check
      - task: lint
      - task: test

  clean:
    desc: Remove build artifacts
    cmd: cargo clean
