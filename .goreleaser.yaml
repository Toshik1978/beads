# Turns a tag into four archives, a checksum file, and one GitHub release. It
# does NOT own the release notes: those are hand-written in CHANGELOG.md and
# passed in with `--release-notes` (see .github/workflows/release.yml).
#
# Try the whole thing without publishing: `task release:snapshot`.
#
# https://goreleaser.com/customization/builds/builders/rust
version: 2

project_name: beads

builds:
  - id: br
    builder: rust
    # HARD INVARIANT: `br` is the name in Cargo.toml's [[bin]], the smoke test
    # in ci.yml, and external tooling. A tarball extracts whatever name it was
    # given, so renaming this breaks those silently.
    binary: br

    # cargo-zigbuild covers all four from one machine, including the C SQLite
    # amalgamation rusqlite's `bundled` feature compiles — but only where a
    # macOS SDK is on disk, which is why the release workflow and
    # `task release:snapshot` run inside ghcr.io/rust-cross/cargo-zigbuild.
    # `task build:cross` reproduces this exact matrix and must stay equal to it.
    #
    # Windows is absent deliberately: cargo-zigbuild does not cover
    # *-pc-windows-msvc, and ci.yml tests ubuntu and macos only — shipping it
    # would mean shipping the one artifact no test has executed.
    #
    # Linux is musl only. It links fully static, so there is no GLIBC floor
    # anywhere in the support matrix. The usual objection (musl's slower
    # allocator) does not apply: src/main.rs installs mimalloc as the
    # `#[global_allocator]` on every non-Windows target, leaving only the
    # bundled C SQLite on libc malloc. Re-adding the gnu targets needs no new
    # knowledge, just the two triples back in both lists.
    targets:
      - x86_64-unknown-linux-musl
      - aarch64-unknown-linux-musl
      - x86_64-apple-darwin
      - aarch64-apple-darwin

    # `--locked` is the point of the gate: the published binary is built from
    # the dependency graph CI tested, not from whatever resolves on release day.
    #
    # `--package=beads` IS REQUIRED. Cargo.toml is both a package and a
    # workspace root, and GoReleaser's rust builder refuses any manifest with a
    # `[workspace]` section unless the flags name a package. Its error lists the
    # *members* array, so it reads as "build test-support" — it is not; it is
    # the builder declining to guess. The `=` is load-bearing too: the check
    # matches the `-p=` and `--package=` prefixes literally.
    flags:
      - --release
      - --locked
      - --package=beads

archives:
  - id: br
    ids:
      - br
    formats:
      - tar.gz
    # Leads with the binary name, not the project name: `br` is what someone
    # looks for in a downloads folder, and the two differ here.
    name_template: "br_{{ .Version }}_{{ .Target }}"
    files:
      - LICENSE
      # The rider and the lineage travel with every binary — a licence
      # condition, not documentation.
      - NOTICE.md
      - README.md

checksum:
  name_template: "br_{{ .Version }}_checksums.txt"
  algorithm: sha256

# DO NOT SET `disable: true` HERE. It reads like the way to stop GoReleaser
# generating its own notes, and it published v1.0.0 with an empty body while
# reporting success: `--release-notes` is read by the changelog pipe itself,
# which loads the file and returns early, so disabling the pipe means the file
# is never opened. Leaving it enabled does not reintroduce a second source of
# notes — the early return happens before any commit scraping.
changelog:
  disable: false

release:
  github:
    owner: Toshik1978
    name: beads
  # v0.2.0-rc.1 is marked pre-release rather than becoming "Latest release".
  prerelease: auto
  draft: false

snapshot:
  # So a snapshot tarball cannot be mistaken for a real one if it escapes.
  version_template: "{{ incpatch .Version }}-SNAPSHOT"
