name: Docs

# The licensing backstop for prose-only changes, which ci.yml skips.
# `tests/licensing.rs` sweeps every git-tracked file, and prose is exactly where
# a bad reference gets written, so the sweep must survive that filter.
#
# THE `paths` LIST BELOW IS THE COMPLEMENT OF ci.yml's `paths-ignore` AND MUST
# BE EDITED WITH IT. A file ignored there and absent here is a file nothing
# checks.
#
# A grep step could not replace this: the forbidden substrings are the
# `DISALLOWED_PATTERNS` constant in tests/licensing.rs, which exempts only
# itself and NOTICE.md — spelling them out here would make this file fail the
# sweep. It is a separate workflow because `paths-ignore` skips a whole
# workflow, never a single job.
on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CLAUDE.md'
      - 'docs/ARCHITECTURE.md'
      - 'docs/RELEASING.md'
      - 'docs/TESTING.md'
  pull_request:
    branches: [main]
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CLAUDE.md'
      - 'docs/ARCHITECTURE.md'
      - 'docs/RELEASING.md'
      - 'docs/TESTING.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  licensing:
    name: Licensing guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: go-task/setup-task@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: env -u RUSTUP_TOOLCHAIN task setup:ci
      - run: env -u RUSTUP_TOOLCHAIN task toolchain:check
      # The test shells out to `git ls-files`, so it needs a real repository.
      - run: env -u RUSTUP_TOOLCHAIN cargo test --test licensing
