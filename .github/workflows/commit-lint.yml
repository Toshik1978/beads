name: Commit messages

# Conventional Commits on every commit reaching `main` and every commit in a PR,
# so a contributor who never ran `pre-commit install` is still caught. It runs
# the repo's own commit-msg hook rather than a third-party action, keeping one
# definition of the rule.
#
# Its own workflow rather than a job in ci.yml: that file installs a toolchain
# and builds the suite on two operating systems, and a malformed subject should
# not wait behind any of it. `.cliff.toml` parses these prefixes to build the
# CHANGELOG, so a commit that does not parse is missing from the release notes.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-messages:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The script walks a commit range, so it needs the ancestors.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install pre-commit
        run: pipx install pre-commit

      # Keyed by the config that pins the hook's rev, so a rev bump invalidates
      # the key by itself and a miss just reinstalls.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-commit-msg-${{ hashFiles('.pre-commit-config.yaml') }}

      # On a PR the range is the PR's commits; on a push, whatever it added.
      # `before` is all zeros for a branch's first push, which the script falls
      # back out of.
      - name: Check commit messages
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: .github/scripts/check-commit-messages.sh "$BASE" "$HEAD_SHA"
