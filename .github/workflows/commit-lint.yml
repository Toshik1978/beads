name: Commit messages

# Conventional Commits, checked on every commit that reaches `main` and every
# commit in a PR — so a contributor who never ran `pre-commit install` is still
# caught before merge.
#
# The check runs the repo's *own* commit-msg hook (see the script), rather than
# a third-party conventional-commits action. Two reasons: the rule then has one
# definition instead of two that can drift, and the wrapper actions in this
# space go stale, while the hook's tool is actively maintained and already
# pinned in .pre-commit-config.yaml.
#
# Deliberately its own workflow rather than a job in ci.yml. That file is the
# expensive one — it installs a toolchain and builds the whole suite on two
# operating systems — and a malformed commit subject should not have to wait
# behind any of that to be reported. This job needs no Rust at all and finishes
# in seconds.
#
# It is not cosmetic enforcement: `.cliff.toml` builds the CHANGELOG by parsing
# these prefixes, and the generated section becomes the GitHub release body
# (docs/RELEASING.md). A commit that does not parse is a commit missing from
# the release notes.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-messages:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The script walks a commit range, so it needs the ancestors.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install pre-commit
        run: pipx install pre-commit

      # The hook's own environment, keyed by the config that pins its rev — a
      # miss just reinstalls it, so a rev bump invalidates the key by itself.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-commit-msg-${{ hashFiles('.pre-commit-config.yaml') }}

      # On a PR, the range is the PR's own commits; on a push to main, whatever
      # that push added. `before` is all zeros for a branch's first push, which
      # the script falls back out of.
      - name: Check commit messages
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: .github/scripts/check-commit-messages.sh "$BASE" "$HEAD_SHA"
