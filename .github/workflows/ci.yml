name: Continuous integration

# Most Markdown here is a CI input, not documentation: `src/cli/mod.rs` asserts
# against docs with `include_str!`, and `tests/licensing.rs` sweeps every
# tracked file. So `paths-ignore` is an explicit allow-list of prose that cannot
# affect a job, never a `**.md` glob. It is the complement of docs.yml's `paths`
# list and must be edited together with it — a path in one and not the other is
# a path nothing checks. commit-lint.yml has no filter and must not gain one.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CLAUDE.md'
      - 'docs/ARCHITECTURE.md'
      - 'docs/RELEASING.md'
      - 'docs/TESTING.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CLAUDE.md'
      - 'docs/ARCHITECTURE.md'
      - 'docs/RELEASING.md'
      - 'docs/TESTING.md'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

  # Disk, not time, is the binding constraint on the Linux runners: building
  # 111 debug test binaries there once died with ENOSPC and a linker SIGBUS.
  # Incremental artifacts buy nothing on a fresh runner, and line tables are all
  # the suite's backtraces use. Neither is set in Cargo.toml — locally both earn
  # their disk.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # There is no rust-toolchain.toml (see CLAUDE.md), so every job installs
  # stable explicitly rather than trusting the runner image. Matrix jobs run
  # fail-fast: false so one OS never hides the other's result.

  # Single OS: rustfmt's verdict comes from the source and rustfmt.toml alone.
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: go-task/setup-task@v2
      - uses: dtolnay/rust-toolchain@stable
      - run: env -u RUSTUP_TOOLCHAIN task setup:ci
      - run: env -u RUSTUP_TOOLCHAIN task toolchain:check
      - run: env -u RUSTUP_TOOLCHAIN task format:check

  lint:
    name: Lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS bills at 10x Linux and most PRs here are Dependabot bumps, so
        # the second leg is added only for pushes to main. Every commit that
        # lands is still gated on both.
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      # ~25GB of unused toolchains, which is the difference between running out
      # of disk and not. `df` either side so a future ENOSPC is diagnosable.
      - name: Reclaim runner disk
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v7
      - uses: go-task/setup-task@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
      - run: env -u RUSTUP_TOOLCHAIN task setup:ci
      - run: env -u RUSTUP_TOOLCHAIN task toolchain:check
      # Needs a C compiler for rusqlite's bundled SQLite; both images ship one.
      - run: env -u RUSTUP_TOOLCHAIN task lint

  # Single OS: `cargo audit` reads Cargo.lock and the advisory database, neither
  # of which varies by runner. No continue-on-error and no ignore list — an
  # audit that cannot fail is decoration.
  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: go-task/setup-task@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: env -u RUSTUP_TOOLCHAIN task setup:ci
      - run: env -u RUSTUP_TOOLCHAIN task toolchain:check
      - run: env -u RUSTUP_TOOLCHAIN task audit

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # See the note on `lint`.
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Reclaim runner disk
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v7
      - uses: go-task/setup-task@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      # `task test` runs under nextest; a prebuilt binary beats compiling it
      # from source on every cache miss.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: env -u RUSTUP_TOOLCHAIN task setup:ci
      - run: env -u RUSTUP_TOOLCHAIN task toolchain:check
      - run: env -u RUSTUP_TOOLCHAIN task test

  # Feeds the two shields.io badges in README.md from a public gist. Push to
  # main only: the badges describe main, fork PRs cannot read the secrets, and
  # an instrumented build costs roughly double. Nothing here gates on a
  # percentage.
  coverage:
    name: Coverage
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      # Read into env so the gist step can be skipped with a plain `if:` —
      # `secrets.*` is not available there, and the workflow must stay green for
      # anyone who has not configured these.
      GIST_ID: ${{ secrets.GIST_ID }}
    steps:
      - name: Reclaim runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v7
      - uses: go-task/setup-task@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - run: env -u RUSTUP_TOOLCHAIN task setup:ci
      - run: env -u RUSTUP_TOOLCHAIN task toolchain:check

      # Doctests are not instrumented: nextest cannot run them and merging
      # rustdoc's coverage needs nightly. All 13 of ours are `#[ignore]`d.
      #
      # Both of these are load-bearing: nextest writes its Summary line to
      # STDERR, so without `2>&1` tee records nothing; and the default `run:`
      # shell is `bash -e` without pipefail, so without `shell: bash` the
      # pipeline reports tee's status and a failing run sails through green.
      - name: Measure coverage
        shell: bash
        run: |
          env -u RUSTUP_TOOLCHAIN cargo llvm-cov nextest --workspace --no-fail-fast \
            --json --summary-only --output-path cov.json 2>&1 | tee nextest.log

      - name: Derive badge values
        shell: bash
        run: |
          COVERAGE=$(python3 -c "import json;print(f\"{json.load(open('cov.json'))['data'][0]['totals']['lines']['percent']:.1f}\")")
          echo "COVERAGE=$COVERAGE" >> "$GITHUB_ENV"
          COLOR=red
          awk "BEGIN{exit !($COVERAGE >= 50)}" && COLOR=orange
          awk "BEGIN{exit !($COVERAGE >= 60)}" && COLOR=yellow
          awk "BEGIN{exit !($COVERAGE >= 70)}" && COLOR=yellowgreen
          awk "BEGIN{exit !($COVERAGE >= 80)}" && COLOR=green
          awk "BEGIN{exit !($COVERAGE >= 90)}" && COLOR=brightgreen
          echo "COVERAGE_COLOR=$COLOR" >> "$GITHUB_ENV"
          # nextest prints one Summary line for the whole run; parse that rather
          # than summing per-binary lines. The gsub strips ANSI colour, which
          # CARGO_TERM_COLOR=always emits even when piped. `tests? run:` because
          # a single-test run says "1 test run:".
          strip_ansi='{gsub(/\033\[[0-9;]*[a-zA-Z]/,"")}'
          PASSED=$(awk "$strip_ansi"'/tests? run:/{for(i=1;i<=NF;i++)if($i ~ /^passed/)print $(i-1)}' nextest.log | tail -1)
          FAILED=$(awk "$strip_ansi"'/tests? run:/{for(i=1;i<=NF;i++)if($i ~ /^failed/)print $(i-1)}' nextest.log | tail -1)
          # A green run prints no `failed` token, so an empty FAILED is normal.
          # An empty PASSED means there was no Summary line at all — publishing
          # "0 passed" in brightgreen for a run that never started is a lie.
          if [ -z "$PASSED" ]; then
            echo "no nextest Summary line found; refusing to publish a badge" >&2
            exit 1
          fi
          echo "TESTS_MSG=$PASSED passed" >> "$GITHUB_ENV"
          echo "TESTS_COLOR=$([ "${FAILED:-0}" -eq 0 ] && echo brightgreen || echo red)" >> "$GITHUB_ENV"
          echo "coverage=$COVERAGE% ($COLOR), tests=$PASSED passed, ${FAILED:-0} failed"

      - name: Publish badge endpoints to the gist
        if: env.GIST_ID != ''
        uses: actions/github-script@v9
        env:
          COVERAGE: ${{ env.COVERAGE }}
          COVERAGE_COLOR: ${{ env.COVERAGE_COLOR }}
          TESTS_MSG: ${{ env.TESTS_MSG }}
          TESTS_COLOR: ${{ env.TESTS_COLOR }}
        with:
          github-token: ${{ secrets.GIST_SECRET_TOKEN }}
          script: |
            const badge = (label, message, color) => ({
              content: JSON.stringify({
                schemaVersion: 1, label, namedLogo: "rust", message, color,
                cacheSeconds: 180,
              }, null, 2),
            });
            await github.rest.gists.update({
              gist_id: process.env.GIST_ID,
              files: {
                'coverage.json': badge("Coverage", `${process.env.COVERAGE}%`,
                                       process.env.COVERAGE_COLOR),
                'tests.json': badge("Tests", process.env.TESTS_MSG,
                                    process.env.TESTS_COLOR),
              },
            });

  # Here rather than only in release.yml: otherwise .goreleaser.yaml is first
  # executed by a tag push, when correcting a typo means deleting a public tag.
  # Validates the config and the release scripts; the cross-compiled build is
  # proven separately by `task build:cross` and `task release:snapshot`.
  release-config:
    name: Release config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
      # A release bumps the manifest and writes the notes in the same commit
      # (docs/RELEASING.md), so this holds continuously between releases and
      # turns "remember to write release notes" into a per-PR check.
      - name: Check the current version has release notes
        run: |
          tag="v$(.github/scripts/check-release-version.sh --manifest-version)"
          echo "Cargo.toml version: $tag"
          .github/scripts/extract-changelog.sh "$tag" >/dev/null

  smoke:
    name: Install smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # See the note on `lint`.
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: smoke
      # Slower than `task build`, but it is what someone cloning the repo runs,
      # and the only job that proves the installed binary starts at all.
      - run: cargo install --path . --locked
      - run: br --version
