name: Release

# A release is cut by pushing a `v*` tag. The tag is the version; this workflow
# only reads the repository. Bump Cargo.toml and write the CHANGELOG.md section
# first — the job uses that section as the release body and fails without one.
# See docs/RELEASING.md.
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release midway: a half-finished run can leave a draft release
  # or a partial asset set behind.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # A separate job so a bad tag fails in seconds, before the build job pulls its
  # 1GB+ cross-compilation image.
  guards:
    name: Check the tag is releasable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Otherwise the archives are named after one version and contain a binary
      # reporting another.
      - name: Check the tag matches Cargo.toml
        run: .github/scripts/check-release-version.sh "$GITHUB_REF_NAME"

      - name: Check the tag has release notes
        run: .github/scripts/extract-changelog.sh "$GITHUB_REF_NAME"

  release:
    name: Build and publish
    needs: guards
    runs-on: ubuntu-latest

    # The container is required, not incidental: the *-apple-darwin targets link
    # CoreFoundation (via chrono's local-timezone lookup) and zig bundles no
    # macOS SDK. Without one they fail with `undefined symbol: _CFRelease` while
    # every Linux target succeeds — i.e. a release that silently ships most of
    # its artifacts. This image carries an SDK and points SDKROOT at it.
    # `task build:cross` is the local reproduction.
    container:
      image: ghcr.io/rust-cross/cargo-zigbuild:0.23.0

    permissions:
      # goreleaser creates the release and uploads the archives and checksums.
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser derives the version from the tag, so it needs the tag
          # objects rather than a shallow snapshot.
          fetch-depth: 0

      # Inside the container the workspace is not owned by the user git runs as,
      # so git otherwise refuses to read the repository at all.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: go-task/setup-task@v2

      # LOAD-BEARING. The image ships rustc 1.93.0, below this crate's 1.95
      # floor, and every target then fails with "rustc 1.93.0 is not supported
      # by the following packages" — which blames the dependencies for a
      # toolchain problem. GoReleaser runs `rustup target add` itself.
      - name: Update the toolchain past the crate's floor
        run: |
          rustup update stable
          rustup default stable

      - name: Refuse a pre-release compiler
        run: env -u RUSTUP_TOOLCHAIN task toolchain:check

      # Re-derived rather than passed from `guards`: the script is deterministic
      # and reads a file already in the checkout.
      - name: Build release body from CHANGELOG
        run: |
          .github/scripts/extract-changelog.sh "$GITHUB_REF_NAME" > release-body.md
          cat release-body.md

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          # `--release-notes` is read by GoReleaser's *changelog pipe*, so it
          # only works while that pipe is enabled — see `changelog:` in
          # .goreleaser.yaml before changing either.
          args: release --clean --release-notes=release-body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # v1.0.0 published four working archives and an empty body with every step
  # green. No earlier check can see the notes: `guards` proves the CHANGELOG
  # section exists and the build step proves the file was written, but only
  # reading the published body proves GoReleaser used it. Separate job on the
  # bare runner because `gh` is not in the cross-compilation image.
  verify:
    name: Check the published release has notes
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Refuse an empty release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body=$(gh release view "$GITHUB_REF_NAME" \
                   --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            echo "error: $GITHUB_REF_NAME was published with an empty body" >&2
            echo "hint: --release-notes is read by GoReleaser's changelog" >&2
            echo "      pipe; check changelog.disable in .goreleaser.yaml" >&2
            exit 1
          fi
          printf '%s\n' "$body" | head -5
          echo "release body: $(printf '%s' "$body" | wc -c) bytes"
