name: Secret detection

# Full-history scan on every push and PR. The pre-commit hook covers commits
# made on a machine with hooks installed; this catches everything else.
on:
  push:
  pull_request:
  workflow_dispatch:

# pull-requests: read — gitleaks-action lists a pull request's commits through the API.
permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # gitleaks scans history

      # Pinned, not "latest": gitleaks config syntax is version-sensitive, and a
      # form the running binary doesn't support is ignored rather than rejected.
      # Keep in step with the local gitleaks the pre-commit hook runs.
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_VERSION: "8.30.1"
